name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Project and Capacitor from Scratch
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyApp" "com.ope36.myapp" --web-dir "."
          
          # التأكد من وجود مجلد الويب ونقل الملفات المرفوعة لمكانها الصحيح
          mkdir -p www
          # نقل ملفات HTML/CSS/JS إلى مجلد www لكي يراها الكاباسيتور
          find . -maxdepth 1 -name "*.html" -exec cp {} www/ \;
          find . -maxdepth 1 -name "*.js" -exec cp {} www/ \;
          find . -maxdepth 1 -name "*.css" -exec cp {} www/ \;

          npx cap add android
          npx cap sync android

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
